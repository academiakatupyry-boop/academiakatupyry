    <!-- CHESSGROUND & CUSTOM STYLES CORRECTED -->
    <style>
        /* CHESSGROUND ELEMENT SELECTORS (Tag selectors, not classes) */
        .cg-wrap {
            width: 100%;
            height: 100%;
            position: relative;
            display: block;
        }

        cg-board,
        cg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
            line-height: 0;
            background-size: cover;
            cursor: pointer;
            /* BLUE AND WHITE CHECKERBOARD PATTERN */
            background-image: conic-gradient(#60A5FA 90deg,
                    #FFFFFF 90deg 180deg,
                    #60A5FA 180deg 270deg,
                    #FFFFFF 270deg);
            background-size: 25% 25%;
        }

        cg-board square {
            position: absolute;
            top: 0;
            left: 0;
            width: 12.5%;
            height: 12.5%;
            pointer-events: none;
        }

        cg-board piece {
            position: absolute;
            top: 0;
            left: 0;
            width: 12.5%;
            height: 12.5%;
            background-size: cover;
            z-index: 2;
            will-change: transform;
            pointer-events: none;
            /* Events are handled by container */
        }

        cg-board piece.dragging {
            cursor: move;
            z-index: 9;
        }

        cg-board piece.anim {
            z-index: 8;
        }

        cg-board piece.fading {
            z-index: 1;
            opacity: .5;
        }

        .cg-wrap piece.ghost {
            opacity: 0.3;
        }

        /* Shapes (SVG overlay) */
        .cg-wrap svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.6;
            overflow: visible;
        }

        /* PIECE IMAGES - Tag Selectors */
        piece.pawn.white {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg');
        }

        piece.bishop.white {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg');
        }

        piece.knight.white {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg');
        }

        piece.rook.white {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg');
        }

        piece.queen.white {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg');
        }

        piece.king.white {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg');
        }

        piece.pawn.black {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg');
        }

        piece.bishop.black {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg');
        }

        piece.knight.black {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg');
        }

        piece.rook.black {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg');
        }

        piece.queen.black {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg');
        }

        piece.king.black {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg');
        }

        /* General Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #E0FFFF;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #7C3AED;
            border-radius: 6px;
            border: 3px solid #E0FFFF;
        }

        .map-path-dashed {
            background-image: linear-gradient(#7dd3fc 50%, rgba(255, 255, 255, 0) 0%);
            background-position: right;
            background-size: 6px 24px;
            background-repeat: repeat-y;
        }

        .dark .map-path-dashed {
            background-image: linear-gradient(#0369a1 50%, rgba(255, 255, 255, 0) 0%);
        }

        .wood-pattern {
            background-color: #FFF8E1;
            background-image: radial-gradient(#D7CCC8 15%, transparent 16%), radial-gradient(#D7CCC8 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .material-symbols-outlined {
            font-variation-settings: "FILL" 1, "wght" 600, "GRAD" 0, "opsz" 24;
